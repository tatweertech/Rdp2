name: Windows RDP via Cloudflare Tunnel

on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest  # Use a valid runner
    timeout-minutes: 360     # Maximum allowed by GitHub

    steps:
    - name: Download Required Files
      run: |
        Invoke-WebRequest https://pastebin.com/raw/qqpuNmye -OutFile start.bat
        # Create loop.bat locally since the pastebin URL is broken
        @"
        :loop
        timeout /t 60 /nobreak >nul
        goto loop
        "@ | Out-File -FilePath loop.bat -Encoding ascii

    - name: Download Cloudflared
      run: |
        Invoke-WebRequest https://github.com/cloudflare/cloudflared/releases/download/2026.8.2/cloudflared-windows-amd64.exe -OutFile cloudflared.exe

    - name: Enable RDP Access
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
        
    - name: Start Cloudflare TCP Tunnel (RDP 3389)
      run: |
        Start-Process Powershell -ArgumentList '-NoExit -Command ".\cloudflared.exe tunnel --url tcp://localhost:3389"'

    - name: Start Session Info
      run: cmd /c start.bat

    - name: Keep Runner Alive
      run: cmd /c loop.bat
