name: Windows RDP via Cloudflare Tunnel

on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest  # Fixed: changed from windows-2025
    timeout-minutes: 360     # Fixed: maximum allowed by GitHub

    steps:
    - name: Create start.bat
      run: |
        @"
        @echo off
        echo =============================================
        echo CLOUDFLARE TUNNEL RDP CONNECTION INFO
        echo =============================================
        echo.
        echo Your RDP credentials are:
        echo Username: runneradmin
        echo Password: P@ssw0rd!
        echo.
        echo The Cloudflare tunnel address appears in the logs above.
        echo Look for a line containing: https://*.trycloudflare.com
        echo.
        echo This session will stay alive for up to 6 hours.
        echo Press Ctrl+C to cancel, or close this window.
        echo =============================================
        pause
        "@ | Out-File -FilePath start.bat -Encoding ascii

    - name: Create loop.bat
      run: |
        @"
        @echo off
        :loop
        timeout /t 60 /nobreak >nul
        goto loop
        "@ | Out-File -FilePath loop.bat -Encoding ascii

    - name: Download Cloudflared
      run: |
        Invoke-WebRequest https://github.com/cloudflare/cloudflared/releases/download/2026.8.2/cloudflared-windows-amd64.exe -OutFile cloudflared.exe

    - name: Enable RDP Access
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
        
    - name: Start Cloudflare TCP Tunnel (RDP 3389)
      run: |
        Start-Process Powershell -ArgumentList '-NoExit -Command ".\cloudflared.exe tunnel --url tcp://localhost:3389"'

    - name: Display Connection Info
      run: cmd /c start.bat

    - name: Keep Runner Alive
      run: cmd /c loop.bat
